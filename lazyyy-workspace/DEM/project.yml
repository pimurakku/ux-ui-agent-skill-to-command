# project.yml — ความจำร่วมของทุกบทบาทในสายงาน
#
# ทุก skill อ่านไฟล์นี้ก่อนเริ่มงาน และเขียนกลับเมื่อได้คำตอบใหม่
# กติกา — ไม่รู้ให้เขียน  TBD — ต้องการ [คน/ข้อมูล]  ห้ามเว้นว่าง ห้ามเดา
# ตัวเลขที่เดา ให้บันทึกไว้ใต้ assumptions ด้วย

meta:
  name: "เตือนการบ้าน"                    # ชื่อโครงการ
  code: DEM                               # รหัสสามตัวอักษรพิมพ์ใหญ่ ใช้แทน XXX ในรหัสเอกสาร
  owner: pimurakku                        # ชื่อนักเรียนเจ้าของโครงการ
  mode: solo                  # solo = คนเดียวเล่นครบทุกบทบาท
  started: 2026-09-12                     # YYYY-MM-DD — วันที่เก็บโจทย์นี้
  language: th                # ภาษาของเอกสารส่งมอบ

# ระยะปัจจุบันของโครงการ — มีเพียง /gate เท่านั้นที่เลื่อนค่านี้
# intake → product → analysis → design → build → review → quality → release
stage: design

problem:
  statement: "นักเรียนมัธยมปลายลืมว่ามีการบ้านอะไรต้องส่งวันไหน จึงส่งงานไม่ทันกำหนด"
  users: "นักเรียนมัธยมปลายที่เรียนหลายวิชาพร้อมกัน"
  frequency: "TBD — ต้องการ [คน/ข้อมูล]"
  today_workaround: "จดใส่กระดาษ หรือถามเพื่อนในไลน์"
  cost: "TBD — ต้องการ [คน/ข้อมูล]"

outcome:
  metric: "TBD — ต้องการ [คน/ข้อมูล]"
  baseline: "TBD — ต้องการ [คน/ข้อมูล]"
  target: "TBD — ต้องการ [คน/ข้อมูล]"
  measured_by: "TBD — ต้องการ [คน/ข้อมูล]"

scope:
  in:                         # อยู่ในขอบเขตรอบนี้
    - "TBD — ต้องการ [คน/ข้อมูล]"
  out:                        # ตัดออกอย่างชัดเจน — ต้องมี ไม่ใช่เว้นว่าง
    - "TBD — ต้องการ [คน/ข้อมูล]"
  constraints:                # เดดไลน์ แพลตฟอร์ม กฎหมาย ข้อมูลเดิม แบรนด์
    - "เวลาทำงาน 30 วันทำงาน"
    - "ไม่มีฐานข้อมูลฝั่งเซิร์ฟเวอร์ — เก็บข้อมูลใน localStorage ของเบราว์เซอร์"
    - "ไม่ใช้เฟรมเวิร์ก — HTML/CSS/JS ล้วน"
  approver: "TBD — ต้องการ [คน/ข้อมูล]"

delivery:
  people: "TBD — ต้องการ [คน/ข้อมูล] — โจทย์ระบุแต่เจ้าของโครงการ (pimurakku) ยังไม่ระบุว่าใครลงมือทำและกี่คน"
  days_available: "30 วันทำงาน"
  iteration_length: "TBD — ต้องการ [คน/ข้อมูล]"
  hard_deadline: "TBD — ต้องการ [คน/ข้อมูล]"

technical:
  data_location: "เครื่องผู้ใช้ — localStorage ของเบราว์เซอร์ ไม่มีฐานข้อมูลฝั่งเซิร์ฟเวอร์"
  offline: "TBD — ต้องการ [คน/ข้อมูล]"
  integrations:               # ต่อกับระบบอะไรบ้าง
    - "TBD — ต้องการ [คน/ข้อมูล]"
  stack: "HTML/CSS/JavaScript ล้วน ไม่ใช้เฟรมเวิร์ก"
  existing_code: "TBD — ต้องการ [คน/ข้อมูล]"

design:
  brand: "TBD — ต้องการ [คน/ข้อมูล]"
  devices:                    # อุปกรณ์เป้าหมาย
    - "TBD — ต้องการ [คน/ข้อมูล]"
  existing_system: "TBD — ต้องการ [คน/ข้อมูล]"

build:
  definition_of_done:         # เกณฑ์ว่างานหนึ่งชิ้นเสร็จ — ดู skill developer
    - "TBD — ต้องการ [คน/ข้อมูล]"
  branch_convention: "TBD — ต้องการ [คน/ข้อมูล]"

quality:
  wcag: AA                    # ระดับที่ยึด
  mutation_testing: false     # true เมื่อโครงการนี้ใช้การทดสอบการกลายพันธุ์ (ต้องมี tests/mutants.json)
  browsers:                   # เบราว์เซอร์และรุ่นที่รองรับ
    - "TBD — ต้องการ [คน/ข้อมูล]"
  design_reference: "TBD — ต้องการ [คน/ข้อมูล]"

release:
  target: "TBD — ต้องการ [คน/ข้อมูล]"
  approver: "TBD — ต้องการ [คน/ข้อมูล]"
  rollback: "TBD — ต้องการ [คน/ข้อมูล]"

