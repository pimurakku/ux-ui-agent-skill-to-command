    raised: 2026-09-14
  - field: "SRS-DEM-001 §2.5 CONF-02"
    note: "ข้อขัดแย้ง — AC-03.1 บังคับกด 1 ครั้ง แต่ guardrail G-02 เขียนว่าไม่เกิน 2 ครั้ง และ AC-03.1 อ้าง G-02 ราวกับตรงกัน · ต้องเปิด /cr · ขวางผลคาดหวังของ TC-15"
    raised: 2026-09-14
  - field: "SRS-DEM-001 §2.5 CONF-03"
    note: "ข้อขัดแย้ง — AC-02.5 สั่งทั้ง 'ยังเพิ่มงานใหม่ได้' และ 'ไม่ลบข้อมูลเดิมทิ้งเอง' ซึ่งทำพร้อมกันไม่ได้ถ้าข้อมูลอยู่คีย์เดียว · ออกแบบบนข้อสมมติ A-07 (กักข้อมูลไว้คีย์ใหม่ ADR-03) ต้องยืนยัน"
    raised: 2026-09-14
  - field: "SRS-DEM-001 §2.5 CONF-04"
    note: "ข้อขัดแย้ง — AC-04.2 (สองแท็บ) กับ G-01 (ห้ามมีรายการหายเอง) ไม่มีเกณฑ์ใดครอบคลุมการเขียนพร้อมกัน · ออกแบบตาม ADR-02 และเพิ่ม TC-22 · ต้องเพิ่มเกณฑ์ยอมรับใน PRD"
    raised: 2026-09-14
  - field: "SRS-DEM-001 §2.5 CONF-05"
    note: "ข้อขัดแย้ง — US-05 ลบงานได้ ทำให้ M1 ลดลงได้ด้วยการลบ และแยกจาก 'ข้อมูลหายเอง' ที่ G-01 ห้ามไม่ได้ · ออกแบบตาม ADR-06 (ลบแบบทิ้งร่องรอย) ซึ่งไม่มีข้อกำหนดใดสั่ง ต้องยืนยันหรือคว่ำ"
    raised: 2026-09-14
  - field: "SRS-DEM-001 §2.5 CONF-06"
    note: "ข้อขัดแย้ง — PRD ข้อ 4 บอกว่า M1 วัดได้เองจากข้อมูลในเครื่อง แต่ไม่มีเกณฑ์ยอมรับใดสั่งให้เก็บเวลาที่ทำเครื่องหมายว่าส่งแล้ว จึงนับ M1 ย้อนหลังรายสัปดาห์ไม่ได้ · SRS เพิ่ม submitted_at ไว้ ต้องยืนยัน"
    raised: 2026-09-14
  - field: "SRS-DEM-001 §2.5 CONF-07"
    note: "ข้อขัดแย้ง — PRD ข้อ 9 สัญญาว่าข้อมูลอยู่จนกว่าผู้ใช้จะลบเอง ขัดกับ AC-04.4 ที่บรรยายกรณีเบราว์เซอร์ล้างข้อมูลเอง · ต้องเติมเงื่อนไขในข้อ 9"
