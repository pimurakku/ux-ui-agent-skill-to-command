  - field: "SRS-DEM-001 §2.5 CONF-09"
    note: "ข้อขัดแย้ง — AC-02.2 ต้องการลำดับคงที่ แต่ไม่มีข้อกำหนดใดสั่งให้เก็บลำดับการบันทึก · SRS เพิ่ม created_seq/next_seq ไว้ (BR-04) ต้องยืนยัน"
