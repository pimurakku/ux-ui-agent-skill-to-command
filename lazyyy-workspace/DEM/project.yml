# ตัวเลขหรือข้อเท็จจริงที่เป็นการเดา ไม่ใช่ของที่รู้จริง
assumptions:
  - text: "เจ้าของโครงการเสนอวิธีแก้มาแล้วว่าใช้ HTML/CSS/JS ล้วน ไม่ใช้เฟรมเวิร์ก ไม่มีฐานข้อมูล เก็บข้อมูลใน localStorage — บันทึกไว้เป็นวิธีแก้ที่เขาเสนอ ยังไม่ใช่ข้อกำหนดที่ผ่านการตรวจกับปัญหา"
    source: "เจ้าของโครงการ (pimurakku) เสนอเอง"
    raised: 2026-09-12
  - text: "มีเวลา 30 วันทำงาน — ยังไม่ยืนยันว่าหักวันลาและวันประชุมออกแล้วหรือยัง"
    source: "เจ้าของโครงการ (pimurakku) ระบุเอง"
    raised: 2026-09-12
  - text: "A-01 · ช่องวิชาไม่บังคับกรอก — อนุมานเพราะไม่มีเกณฑ์ยอมรับใดปฏิเสธวิชาว่าง"
    source: "นักวิเคราะห์ระบบ · SRS-DEM-001 §11"
    raised: 2026-09-14
  - text: "A-02 · ช่องวันกำหนดส่งบังคับกรอก — อนุมานเพราะการเรียงลำดับ (AC-02.1) และสถานะเลยกำหนด (AC-02.3) นิยามไม่ได้ถ้าไม่มีค่า"
    source: "นักวิเคราะห์ระบบ · SRS-DEM-001 §11"
    raised: 2026-09-14
  - text: "A-03 · 'เลยกำหนด' ใช้วันตามปฏิทินท้องถิ่นของอุปกรณ์ เส้นแบ่งวันเวลา 00:00 น. — PRD ไม่ระบุเส้นแบ่งวันหรือเขตเวลา"
    source: "นักวิเคราะห์ระบบ · SRS-DEM-001 §11"
    raised: 2026-09-14
  - text: "A-04 · ความจุ ≈400 รายการต่อผู้ใช้ต่อปีการศึกษา (10 งาน/สัปดาห์ × 40 สัปดาห์) และขนาดต่อรายการ ≈440 ไบต์ → ≈176 KB — เป็นตัวเลขที่นักวิเคราะห์คำนวณเอง ไม่ใช่ตัวเลขที่ใครยืนยัน · โควตา localStorage จริงยังไม่รู้เพราะ quality.browsers เป็น TBD"
    source: "นักวิเคราะห์ระบบ · SRS-DEM-001 §4.3"
    raised: 2026-09-14
  - text: "A-05 · ข้อห้ามเรื่องปฏิทิน (PRD ข้อ 5.8) ตีความว่าห้ามมุมมองรายการแบบปฏิทิน ไม่ได้ห้ามตัวเลือกวันที่ในแบบฟอร์ม"
    source: "นักวิเคราะห์ระบบ · SRS-DEM-001 §11"
    raised: 2026-09-14
  - text: "A-06 · การลบงานเป็นการลบแบบทิ้งร่องรอย (deleted_at) ไม่ใช่ลบถาวร — ตัดสินโดยนักวิเคราะห์เพื่อให้ G-01 และ M1 พิสูจน์ได้ ไม่มีข้อกำหนดใดสั่ง (ADR-06)"
    source: "นักวิเคราะห์ระบบ · SRS-DEM-001 §5.2"
    raised: 2026-09-14
  - text: "A-07 · ข้อมูลที่อ่านไม่ได้ถูกคัดลอกไปเก็บในคีย์แยกก่อนเริ่มชุดใหม่ (ADR-03) — เกิดจากข้อขัดแย้งภายใน AC-02.5 เอง ไม่ได้มาจากข้อกำหนด"
    source: "นักวิเคราะห์ระบบ · SRS-DEM-001 §5.2"
    raised: 2026-09-14
  - text: "A-08 · project.yml ที่นักวิเคราะห์อ่านเมื่อ 2026-09-14 ถือว่าเป็นฉบับเดียวกับที่ PRD-DEM-001 rev 01 อ้าง (ลงวันที่ 2026-09-12) — ไฟล์ไม่มีหมายเลขฉบับจึงตรวจเทียบตรง ๆ ไม่ได้"
    source: "นักวิเคราะห์ระบบ · SRS-DEM-001 §11"
    raised: 2026-09-14
